services:
  kong:
    image: kong:3.9.1
    container_name: jiuwenswarm-kong
    network_mode: host
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_STATUS_LISTEN: 127.0.0.1:8100
      KONG_LOG_LEVEL: info
    volumes:
      - ./kong/kong.yml:/opt/kong/kong.yml:ro
